<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2a0845" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#120224" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#07010f" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="ambient-cyan" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-magenta" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </radialGradient>
    <!-- Outer neon glow filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a8d" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg-glow)" stroke="#ff007f" stroke-opacity="0.2" stroke-width="1.5" />
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ambient-cyan)" />
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#ambient-magenta)" />

  <!-- Neon Play Triangle Wireframe -->
  <!-- Center is (64, 64). Play button points right. -->
  <!-- Apex right: (88, 64), Top left: (46, 38), Bottom left: (46, 90) -->
  <g filter="url(#neon-glow)">
    <!-- Deep Magenta wide halo -->
    <polygon points="46,38 88,64 46,90" fill="none" stroke="#e0007b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <!-- Violet/Pink bright bloom -->
    <polygon points="46,38 88,64 46,90" fill="none" stroke="#d946ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <!-- White-hot inner core -->
    <polygon points="46,38 88,64 46,90" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
